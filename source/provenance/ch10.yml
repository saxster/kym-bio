  research:
  - what: 'Core/Supplement placement independently checked: Topic 10.1 Diseases and immunity (10.1.1–10.1.17: pathogen
      and transmissible disease definitions, direct/indirect transmission, mechanical/chemical/cellular barriers,
      five community hygiene controls, active vs passive immunity, antigen-antibody complementary specificity, vaccination
      and memory cells, placenta/breast milk passive immunity without the transferred antibody itself creating recipient
      antigen-specific memory, and cholera toxin Cl⁻ secretion / osmotic diarrhoea)'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
    url: https://www.cambridgeinternational.org/Images/697203-2026-2028-syllabus.pdf
  - what: 0893 biology/scientific thinking level fit only; full framework not publicly inspected, no exact objective
      codes asserted
    source: Cambridge official Lower Secondary Science 0893 overview
    url: https://www.cambridgeinternational.org/programmes-and-qualifications/cambridge-lower-secondary/curriculum/science/
  - source: CDC principles of vaccination
    url: https://www.cdc.gov/pinkbook/hcp/table-of-contents/chapter-1-principles-of-vaccination.html
    what: Protection and duration vary; liveattenuated organisms canreplicate; distinguish B/Tfunctions.
  - source: Mahalanabis et al.1973
    url: https://pubmed.ncbi.nlm.nih.gov/4698667/
    what: Bongaon3703 admissions mixedseverity/mixedtreatment; overall3.6%casefatality, not controlled30to3.6reduction.
  - source: CDC cholera treatment
    url: https://www.cdc.gov/cholera/treatment/
    what: StandardpackagedORS and clinicalrehydration; not an unmeasuredmixingrecipe.
  history:
  - what: TRUE:1959 Calcutta (Nilratan Sircar Medical College) rabbit ligated ileal-loop proof by Sambhu Nath De
      that cell-free Vibrio cholerae culture filtrate causes massive fluid outpouring across an intact intestinal
      epithelium; 1971 Bongaon refugee-camp oral rehydration therapy demonstration by Dilip Mahalanabis and colleagues
      treating 3,703 patients of mixed severity with oral glucose-salt solution and reporting 3.6% overall case
      fatality among 3,703 admissions of mixed severity and treatments; no controlled before/after mortality claim
    source: De SN (1959) Enterotoxicity of bacteria-free culture-filtrate of Vibrio cholerae, Nature 183(4674):1533–1534;
      Mahalanabis D, Choudhuri AB, Bagchi NG, Bhattacharya AK, Simpson TW (1973) Oral fluid therapy of cholera among
      Bangladesh refugees, Johns Hopkins Medical Journal 132(4):197–205
    url: https://doi.org/10.1038/1831533a0
  - what: TRUE:Louis Pasteur (1859–1885) germ theory and attenuated vaccines; Kamal Ranadive and C. V. Bapat (1958)
      at the Indian Cancer Research Centre in Parel, Mumbai isolating and culturing the ICRC bacillus for leprosy
      antigen vaccine research; Gagandeep Kang and colleagues (2011–2014) at Christian Medical College, Vellore
      demonstrating natural and Rotavac oral rotavirus vaccine protection in Indian infants
    source: Bapat CV, Ranadive KJ, Khanolkar VR (1958) International Journal of Leprosy 26(4):353–360; Bhandari
      N, Rongsen-Chandola T, Bavdekar A, John J, Antony K, Taneja S, Zaki S, Kawade A, Kang G et al. (2014) The
      Lancet 383(9935):2136–2143 (existing story p-pasteur linked without modification)
    url: https://doi.org/10.1016/S0140-6736(13)62630-6
  figures:
  - name: c10_pathogens_barriers_cholera
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; five-part schematic of transmission routes, five hygiene defences, mechanical/chemical
      barriers, and cholera toxin Cl⁻ secretion vs ORS Na⁺–glucose cotransport
  - name: c10_immune_response_vaccines
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; schematic of phagocytes vs lymphocytes, complementary antigen-antibody fit (Pathogen A
      vs B), and primary vs memory-driven secondary antibody response curve
  - name: c10_active_vs_passive_immunity
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; four-pathway comparison and plasma antibody persistence curve (passive t₁/₂ ≈ 21 days
      decay vs active memory persistence)
  - name: c10_diabetes_renal_case
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: 'Corrected rate account: Tm is an illustrative 330 mg/min transport capacity, distinct from a concentration
      threshold. Filtered glucose rate = plasma glucose × GFR; at 16 mmol/L and 125 mL/min, 360 mg/min filters,
      330 mg/min is recovered, and 30 mg/min = 43.2 g/day = 240 mmol/day remains in this hard-cap teaching model.
      Urine volume is a separate chosen scenario or observed case quantity. Rounded model protein zeros are not
      clinical proof of an intact barrier.'
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under
    recorded series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party
    research, dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: Primary and later antibody response curves use illustrative arbitrary units. No cross-recognition in
    an A/B comparison is an explicit model assumption, not a universal 0% binding law. A21-day decay is an IgG-like
    model, not a law for all maternal or transferred antibodies. ORS illustrates uptake remaining available during
    secretion; it does not remove pathogen or toxin.
  scope: 'Completes Volume III (The Human Orchestra) and bridges to Volume IV (Chapter 11: DNA, RNA and protein
    synthesis); links existing story p-pasteur without modifying p-pasteur.md.'
