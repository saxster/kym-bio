  research:
  - what: 'Core/Supplement placement independently checked: Topic 14.4 Homeostasis (14.4.1–14.4.5: homeostasis definition,
      insulin decreasing blood glucose, negative feedback around a set point, liver/insulin/glucagon blood glucose
      control, and Type 1 diabetes treatment)'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
