      lungs; urea, excess water and excess ions via kidneys; kidneys, ureters, bladder, urethra; cortex and medulla;
      nephron glomerulus filtration, tubule reabsorption of all glucose, some ions and most water, collecting duct
      urine formation; liver assimilation of amino acids and deamination of excess amino acids; toxicity of urea)'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
    url: https://www.cambridgeinternational.org/Images/697203-2026-2028-syllabus.pdf
  - what: 0893 biology/scientific thinking level fit only; full framework not publicly inspected, no exact objective
      codes asserted
    source: Cambridge official Lower Secondary Science 0893 overview
    url: https://www.cambridgeinternational.org/programmes-and-qualifications/cambridge-lower-secondary/curriculum/science/
  - source: Al-Jobori et al.2017
    url: https://pubmed.ncbi.nlm.nih.gov/28428225/
    what: Renal glucose maximal transport rate and plasma threshold are distinct.
  - source: NIDDK urine albumin and GFR
    url: https://www.niddk.nih.gov/health-information/professionals/advanced-search/quick-reference-uacr-gfr
    what: Negative routineprotein test does not establish perfect kidneyhealth.
  history:
  - what: TRUE:Carl Ludwig (1844) physical glomerular filtration proposal and Joseph T. Wearn & Alfred Newton Richards
      (1924) quartz micropipette puncture of living frog Bowman's capsules proving directly that glomerular filtrate
      is strongly depleted of protein and containing glucose, while the tested final urine was negative for glucose
    source: Ludwig C (1844) Handwörterbuch der Physiologie Vol. 2:628–640; Wearn JT, Richards AN (1924) Observations
      on the composition of glomerular urine, with particular reference to the problem of reabsorption in the renal
      tubules, American Journal of Physiology 71(1):209–227
    url: https://doi.org/10.1152/ajplegacy.1924.71.1.209
  - what: TRUE:Peter Agre, Gregory Preston, William Guggino and John Parker (1991–1992) identification and frog-oocyte
      functional proof of aquaporin water channels enabling rapid osmotic water reabsorption in renal tubules and
      collecting ducts
    source: Preston GM, Carroll TP, Guggino WB, Agre P (1992) Appearance of water channels in Xenopus oocytes expressing
      red cell CHIP28 protein, Science 256(5055):385–387 (existing story p-agre reused without modification)
    url: https://doi.org/10.1126/science.256.5055.385
  figures:
  - name: c10_liver_excretion_urea
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; schematic of hepatic amino acid assimilation vs deamination (left) and human urinary tract
      with kidney cortex/medulla (right) above an Excretion vs Egestion ledger
  - name: c10_kidney_nephron_ledger
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; schematic nephron across cortex and medulla above a 5-row quantitative concentration and
      daily mass-balance table (180 L/day filtrate to 1.5 L/day urine)
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under
    recorded series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party
    research, dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: 125 mL/min × 1440 = 180 L/day; 5 mmol/L glucose ×180 g/mol =0.09 g/100mL; filtered glucose162 g/day.
    At16 mmol/L, filtered360 mg/min minus illustrative330 mg/min maximum recovery leaves30 mg/min=43.2g/day=240mmol/day.
    Urine concentration depends on final urine volume. 178.5L reabsorbed/180L=99.17%; filtered54g urea versus urinary30g
    accounts for24g net reabsorption.
  activity: Safe kitchen strainer/coffee-filter sieve comparison using kidney beans (rajma), dissolved sugar and
    table salt in water; reviewed for safety and feasibility, explicitly disclosed as not classroom-trialled for
    this edition.
  scope: Distinguishes excretion from egestion, and liver urea production (deamination) from kidney urea excretion;
    links existing story p-agre without modifying p-agre.md.
