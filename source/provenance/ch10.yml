story:banting-mahalanabis-lifelines:
  ocw: []
  openstax: []
  research:
  - source: CDC cholera treatment and original Mahalanabis1973 report
    url: https://pubmed.ncbi.nlm.nih.gov/4698667/
    what: Corrected mixedseverity/mixedtreatment3703 patients and3.6%overallfatality; removed casual recipe and
      unsupported controlled mortalityeffect.
  history:
  - what: TRUE:1921–1922 University of Toronto extraction of pancreatic islet insulin by Frederick Banting and Charles
      Best in J. J. R. Macleod's laboratory, fractional alcohol purification by James Collip, and 11 & 23 January
      1922 injections rescuing 14-year-old Leonard Thompson at Toronto General Hospital
    source: Banting FG, Best CH, Collip JB, Campbell WR, Fletcher AA (1922) Pancreatic extracts in the treatment
      of diabetes mellitus, Canadian Medical Association Journal 12(3):141–146, PMC1524425; primary paper examined
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1524425/
  - what: TRUE:1959 Nilratan Sircar Medical College (Calcutta / Kolkata) rabbit ligated ileal-loop proof by Sambhu
      Nath De that sterile bacteria-free Vibrio cholerae culture filtrate causes massive fluid secretion across
      an intact intestinal epithelium; 1971 Bongaon refugee-camp oral rehydration therapy demonstration by Dilip
      Mahalanabis and colleagues treating 3,703 patients of mixed severity with oral glucose-salt solution and reporting
      an overall 3.6% case-fatality ratio across mixed severity and treatments
    source: De SN (1959) Enterotoxicity of bacteria-free culture-filtrate of Vibrio cholerae, Nature 183(4674):1533–1534;
      Mahalanabis D, Choudhuri AB, Bagchi NG, Bhattacharya AK, Simpson TW (1973) Oral fluid therapy of cholera among
      Bangladesh refugees, Johns Hopkins Medical Journal 132(4):197–205
    url: https://doi.org/10.1038/1831533a0
  figures: []
  licence: Original prose CC BY-NC-SA 4.0; historical primary papers cited for documented facts only; no photographs,
    quotes or art copied.
  truth_status: TRUE documented places (Toronto, Kolkata / Nilratan Sircar Medical College, Bongaon on the West
    Bengal border), dates (1920, 1921, 11 and 23 January 1922, 1959, 1968, 1971), experimental designs, and clinical
    numbers (Leonard Thompson 65 lb / 29.5 kg, blood glucose 520 mg/dL to 120 mg/dL; Bongaon 3,703 patients, overall
    case fatality 3.6%). No invented dialogue or scenes.
  access_limits: Banting et al. 1922 (PMC1524425) examined directly; De 1959 and Mahalanabis et al. 1973 verified
    via published abstracts, WHO historical bulletin reprints and primary bibliometric records.
