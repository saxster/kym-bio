'10.1':
  ocw: []
  openstax:
  - book: Biology 2e
    section: 33.3 Homeostasis
    url: https://openstax.org/books/biology-2e/pages/33-3-homeostasis
    took: Homeostatic control loops around a set point, receptor-coordinator-effector architecture, and negative feedback versus positive feedback
  - book: Biology 2e
    section: 37.3 Regulation of Body Processes
    url: https://openstax.org/books/biology-2e/pages/37-3-regulation-of-body-processes
    took: Pancreatic beta-cell insulin and alpha-cell glucagon regulation of blood glucose concentration and hepatic glycogen storage/breakdown
  - book: Concepts of Biology
    section: 16.1 Homeostasis and Osmoregulation; 16.4 Endocrine System
    url: https://openstax.org/books/concepts-of-biology/pages/16-1-homeostasis-and-osmoregulation
    took: Accessible framing of blood glucose regulation, negative feedback, and Type 1 diabetes
  research:
  - what: 'Core/Supplement placement independently checked: Topic 14.4 Homeostasis (14.4.1–14.4.5: homeostasis definition, insulin decreasing blood glucose, negative feedback around a set point, liver/insulin/glucagon blood glucose control, and Type 1 diabetes treatment)'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
    url: https://www.cambridgeinternational.org/Images/697203-2026-2028-syllabus.pdf
  - what: 0893 biology/scientific thinking level fit only; full framework not publicly inspected, no exact objective codes asserted
    source: Cambridge official Lower Secondary Science 0893 overview
    url: https://www.cambridgeinternational.org/programmes-and-qualifications/cambridge-lower-secondary/curriculum/science/
  - what: 'Word origin only, not mechanism evidence: homeostasis, insulin, glucagon, glycogen'
    source: Wiktionary / etymological entries
    url: https://en.wiktionary.org/wiki/homeostasis
  history:
  - what: TRUE:Claude Bernard (1859/1865) formulation of the internal environment (milieu intérieur) and hepatic glycogen storage; Walter B. Cannon (1926/1929) coinage of homeostasis from Greek homoios ('similar, allowing narrow physiological variation') and stasis ('condition')
    source: Bernard C (1865) Introduction à l'étude de la médecine expérimentale; Cannon WB (1929) Organization for physiological homeostasis, Physiological Reviews 9(3):399–431
    url: https://doi.org/10.1152/physrev.1929.9.3.399
  - what: TRUE:1921–1922 Toronto extraction of pancreatic islet insulin by Frederick Banting and Charles Best in J. J. R. Macleod's laboratory, fractional alcohol purification by James Collip, and January 1922 clinical rescue of 14-year-old Leonard Thompson at Toronto General Hospital (blood glucose falling from 520 mg/dL to 120 mg/dL and glycosuria dropping to near zero)
    source: Banting FG, Best CH, Collip JB, Campbell WR, Fletcher AA (1922) Pancreatic extracts in the treatment of diabetes mellitus, Canadian Medical Association Journal 12(3):141–146, PMC1524425; primary paper examined
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1524425/
  figures:
  - name: c10_negative_feedback_glucose
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; schematic figure-of-eight negative-feedback loop around the 5.0 mmol/L (4.0–5.5 mmol/L) plasma glucose set point above a 6-hour post-meal glucose trace and Type 1 diabetes comparison
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under recorded series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party research, dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: 'Two-hormone blood glucose feedback model in homeostasis_model.js: around the 5.0 mmol/L set point, post-meal load raises beta-cell insulin and hepatic glycogen synthesis (+g/h), fasting raises alpha-cell glucagon and glycogenolysis (−g/h), and untreated Type 1 diabetes (0 insulin) drives plasma glucose >14 mmol/L above renal T_m (10.5 mmol/L). Verified in tests/ch10_domain.mjs.'
  scope: Covers 0610 Topic 14.4.1–14.4.5 and links companion story banting-mahalanabis-lifelines.

