'10.3':
  ocw: []
  openstax:
  - book: Biology 2e
    section: 41.2 The Kidneys and Osmoregulatory Organs; 41.3 Excretion Systems; 41.4 Nitrogenous Wastes
    url: https://openstax.org/books/biology-2e/pages/41-2-the-kidneys-and-osmoregulatory-organs
    took: Hepatic deamination of excess amino acids to ammonia and urea, kidney cortex and medulla anatomy, and nephron glomerular filtration, selective tubular reabsorption and urine formation
  - book: Concepts of Biology
    section: 16.2 Digestive and Excretory Systems
    url: https://openstax.org/books/concepts-of-biology/pages/16-2-digestive-system
    took: Urinary system gross anatomy (kidneys, ureters, urinary bladder, urethra) and two-stage nephron overview
  research:
  - what: 'Core/Supplement placement independently checked: Topic 13.1 Excretion in humans (13.1.1–13.1.9: CO₂ via lungs; urea, excess water and excess ions via kidneys; kidneys, ureters, bladder, urethra; cortex and medulla; nephron glomerulus filtration, tubule reabsorption of all glucose, some ions and most water, collecting duct urine formation; liver assimilation of amino acids and deamination of excess amino acids; toxicity of urea)'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
    url: https://www.cambridgeinternational.org/Images/697203-2026-2028-syllabus.pdf
  - what: 0893 biology/scientific thinking level fit only; full framework not publicly inspected, no exact objective codes asserted
    source: Cambridge official Lower Secondary Science 0893 overview
    url: https://www.cambridgeinternational.org/programmes-and-qualifications/cambridge-lower-secondary/curriculum/science/
  history:
  - what: TRUE:Carl Ludwig (1844) physical glomerular filtration proposal and Joseph T. Wearn & Alfred Newton Richards (1924) quartz micropipette puncture of living frog Bowman's capsules proving directly that glomerular filtrate is protein-free and contains plasma-level glucose, whereas bladder urine from the same kidney contains zero glucose
    source: Ludwig C (1844) Handwörterbuch der Physiologie Vol. 2:628–640; Wearn JT, Richards AN (1924) Observations on the composition of glomerular urine, with particular reference to the problem of reabsorption in the renal tubules, American Journal of Physiology 71(1):209–227
    url: https://doi.org/10.1152/ajplegacy.1924.71.1.209
  - what: TRUE:Peter Agre, Gregory Preston, William Guggino and John Parker (1991–1992) identification and frog-oocyte functional proof of aquaporin water channels enabling rapid osmotic water reabsorption in renal tubules and collecting ducts
    source: Preston GM, Carroll TP, Guggino WB, Agre P (1992) Appearance of water channels in Xenopus oocytes expressing red cell CHIP28 protein, Science 256(5055):385–387 (existing story p-agre reused without modification)
    url: https://doi.org/10.1126/science.256.5055.385
  figures:
  - name: c10_liver_excretion_urea
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; schematic of hepatic amino acid assimilation vs deamination (left) and human urinary tract with kidney cortex/medulla (right) above an Excretion vs Egestion ledger
  - name: c10_kidney_nephron_ledger
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; schematic nephron across cortex and medulla above a 5-row quantitative concentration and daily mass-balance table (180 L/day filtrate to 1.5 L/day urine)
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under recorded series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party research, dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: 'Two-kidney nephron mass balance in homeostasis_model.js: GFR 125 mL/min = 180.0 L/day filtrate; plasma protein 8.0 g/100mL -> 0.0 in filtrate and urine; below T_m = 10.5 mmol/L, 100% of filtered glucose is reabsorbed; at 16.0 mmol/L plasma glucose, 5.5 mmol/L spills into urine and increases urine output to 3.81 L/day by osmotic diuresis. Verified in tests/ch10_domain.mjs.'
  activity: Safe kitchen strainer/coffee-filter sieve comparison using kidney beans (rajma), dissolved sugar and table salt in water; reviewed for safety and feasibility, explicitly disclosed as not classroom-trialled for this edition.
  scope: Distinguishes excretion from egestion, and liver urea production (deamination) from kidney urea excretion; links existing story p-agre without modifying p-agre.md.

'10.4':
  ocw: []
  openstax:
  - book: Biology 2e
    section: 42.1 Innate Immune Response; 42.2 Adaptive Immune Response; 42.3 Antibodies
    url: https://openstax.org/books/biology-2e/pages/42-1-innate-immune-response
    took: Mechanical and chemical body barriers, phagocytosis by phagocytes, lymphocyte antigen recognition, complementary antibody production, memory cells, vaccination, and active versus passive immunity
  - book: Microbiology
    section: 16 Disease and Epidemiology; 17 Innate Nonspecific Host Defenses; 18 Adaptive Specific Host Defenses; 24.3 Bacterial Infections of the Gastrointestinal Tract
    url: https://openstax.org/books/microbiology/pages/24-3-bacterial-infections-of-the-gastrointestinal-tract
    took: Direct and indirect transmission routes, hygiene controls, Vibrio cholerae enterotoxin Cl⁻ secretion and osmotic water movement into the small intestine, and oral rehydration therapy
  research:
  - what: 'Core/Supplement placement independently checked: Topic 10.1 Diseases and immunity (10.1.1–10.1.17: pathogen and transmissible disease definitions, direct/indirect transmission, mechanical/chemical/cellular barriers, five community hygiene controls, active vs passive immunity, antigen-antibody complementary specificity, vaccination and memory cells, placenta/breast milk passive immunity with zero memory cells, and cholera toxin Cl⁻ secretion / osmotic diarrhoea)'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
    url: https://www.cambridgeinternational.org/Images/697203-2026-2028-syllabus.pdf
  - what: 0893 biology/scientific thinking level fit only; full framework not publicly inspected, no exact objective codes asserted
    source: Cambridge official Lower Secondary Science 0893 overview
    url: https://www.cambridgeinternational.org/programmes-and-qualifications/cambridge-lower-secondary/curriculum/science/
  history:
  - what: TRUE:1959 Calcutta (Nilratan Sircar Medical College) rabbit ligated ileal-loop proof by Sambhu Nath De that cell-free Vibrio cholerae culture filtrate causes massive fluid outpouring across an intact intestinal epithelium; 1971 Bongaon refugee-camp oral rehydration therapy demonstration by Dilip Mahalanabis and colleagues treating 3,703 severe cholera patients with oral glucose-salt solution and reducing case fatality from ~30% to 3.6%
    source: De SN (1959) Enterotoxicity of bacteria-free culture-filtrate of Vibrio cholerae, Nature 183(4674):1533–1534; Mahalanabis D, Choudhuri AB, Bagchi NG, Bhattacharya AK, Simpson TW (1973) Oral fluid therapy of cholera among Bangladesh refugees, Johns Hopkins Medical Journal 132(4):197–205
    url: https://doi.org/10.1038/1831533a0
  - what: TRUE:Louis Pasteur (1859–1885) germ theory and attenuated vaccines; Kamal Ranadive and C. V. Bapat (1958) at the Indian Cancer Research Centre in Parel, Mumbai isolating and culturing the ICRC bacillus for leprosy antigen vaccine research; Gagandeep Kang and colleagues (2011–2014) at Christian Medical College, Vellore demonstrating natural and Rotavac oral rotavirus vaccine protection in Indian infants
    source: Bapat CV, Ranadive KJ, Khanolkar VR (1958) International Journal of Leprosy 26(4):353–360; Bhandari N, Rongsen-Chandola T, Bavdekar A, John J, Antony K, Taneja S, Zaki S, Kawade A, Kang G et al. (2014) The Lancet 383(9935):2136–2143 (existing story p-pasteur linked without modification)
    url: https://doi.org/10.1016/S0140-6736(13)62630-6
  figures:
  - name: c10_pathogens_barriers_cholera
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; five-part schematic of transmission routes, five hygiene defences, mechanical/chemical barriers, and cholera toxin Cl⁻ secretion vs ORS Na⁺–glucose cotransport
  - name: c10_immune_response_vaccines
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; schematic of phagocytes vs lymphocytes, complementary antigen-antibody fit (Pathogen A vs B), and primary vs memory-driven secondary antibody response curve
  - name: c10_active_vs_passive_immunity
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; four-pathway comparison and plasma antibody persistence curve (passive t₁/₂ ≈ 21 days decay vs active memory persistence)
  - name: c10_diabetes_renal_case
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; chapter-end diagnostic synthesis comparing a healthy nephron (5.0 mmol/L glucose) with an untreated Type 1 diabetes nephron (16.0 mmol/L glucose exceeding proximal tubule T_m ≈ 10.5 mmol/L with intact glomerular protein barrier)
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under recorded series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party research, dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: 'Immunity and ORS model in homeostasis_model.js: naive primary peak 28 AU at Day 14 vs post-vaccine secondary peak 221.6 AU at Day 7 (90% memory); mismatched antigen B gives 0% binding; passive antibody decays with t₁/₂ = 21.0 days and 0 memory cells; 80% ORS dose gives +124 mL/h net intestinal water rescue. Verified in tests/ch10_domain.mjs.'
  scope: 'Completes Volume III (The Human Orchestra) and bridges to Volume IV (Chapter 11: DNA, RNA and protein synthesis); links existing story p-pasteur without modifying p-pasteur.md.'

