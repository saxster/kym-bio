    url: https://en.wiktionary.org/wiki/homeostasis
  - source: FDA insulin history
    url: https://www.fda.gov/about-fda/fda-history-exhibits/100-years-insulin
    what: Banting/Best beganMay1921; Collip joinedDecember1921.
  history:
  - what: TRUE:Claude Bernard (1859/1865) formulation of the internal environment (milieu intérieur) and hepatic
      glycogen storage; Walter B. Cannon (1926/1929) coinage of homeostasis from Greek homoios ('similar, allowing
      narrow physiological variation') and stasis ('condition')
    source: Bernard C (1865) Introduction à l'étude de la médecine expérimentale; Cannon WB (1929) Organization
      for physiological homeostasis, Physiological Reviews 9(3):399–431
    url: https://doi.org/10.1152/physrev.1929.9.3.399
  - what: TRUE:1921–1922 Toronto extraction of pancreatic islet insulin by Frederick Banting and Charles Best in
      J. J. R. Macleod's laboratory, fractional alcohol purification by James Collip, and January 1922 clinical
      rescue of 14-year-old Leonard Thompson at Toronto General Hospital (blood glucose falling from 520 mg/dL to
      120 mg/dL and glycosuria dropping to near zero)
    source: Banting FG, Best CH, Collip JB, Campbell WR, Fletcher AA (1922) Pancreatic extracts in the treatment
      of diabetes mellitus, Canadian Medical Association Journal 12(3):141–146, PMC1524425; primary paper examined
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1524425/
  figures:
  - name: c10_negative_feedback_glucose
    origin: ours; original semantic-theme schematic code in figs_ch10.py; no source illustrations or photographs
    limits: Not to scale; schematic figure-of-eight negative-feedback loop around the 5.0 mmol/L (4.0–5.5 mmol/L)
      plasma glucose set point above a 6-hour post-meal glucose trace and Type 1 diabetes comparison
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under
    recorded series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party
    research, dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: Illustrative glucose feedback around 5 mmol/L. Insulin-sensitive muscle uptake, storage and suppression
    of hepatic glucose output are distinguished from glucagon action. Fixed scenario values are not clinical predictions.
  scope: Covers 0610 Topic 14.4.1–14.4.5 and links companion story banting-mahalanabis-lifelines.
