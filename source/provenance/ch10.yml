record:ch10-decisions:
  preservation: tests/ch10-preserved.json captures all 265 pre-existing files (Chapters 0–9 + baselines/gates/runners). Only existing-file change is append-only three Chapter 10 enhancements in source/live/enhancements.js; exact original 62,628 bytes reconstructed and verified. Existing stories p-agre.md and p-pasteur.md linked in Sections 10.3 and 10.4 without modifying either file.
  corrections: 'Covered full Cambridge IGCSE 0610 Topics 14.4 (Homeostasis), 13.1 (Excretion in humans) and 10.1 (Diseases and immunity); enforced strict distinction between arteriole vasodilation/vasoconstriction and fixed-position surface capillaries; separated excretion from egestion and hepatic deamination from renal filtration; unified pancreatic insulin deficiency and renal proximal tubular transport maximum (T_m) saturation in the end-of-chapter case.'
  source_terms: Recorded source-use decision is not a source licence waiver or evidence of written permission. OpenStax access-for-free footer retained; original prose/art only.
  access_limits: Primary papers Banting et al. 1922 (PMC1524425), Cannon 1929, Wearn & Richards 1924, Preston & Agre 1992, De 1959, Mahalanabis et al. 1973, Bapat & Ranadive 1958, and Bhandari & Kang et al. 2014 verified via open-access archives and PubMed/WHO records; exact 0893 framework unavailable; MIT OCW courses not cited where not directly inspected.
  physical_trials: Two safe home comparisons (damp vs dry handkerchief on steel tumblers in fan breeze, and rajma/sugar/salt kitchen strainer sieve) reviewed for safety and feasibility and explicitly disclosed in text as not classroom-trialled for this edition.
  publication: No publication, deployment, commit, push, clone or remote repository operation.
