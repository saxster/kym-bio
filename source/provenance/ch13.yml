story:mendel-morgan-sanghvi-inheritance:
  ocw: []
  openstax: []
  research: []
  history:
  - what: 'TRUE:Johann Gregor Mendel (1851–1853 University of Vienna studies under Christian Doppler and Andreas von Ettingshausen; 1856–1863 Brno abbey garden experiments on Pisum sativum; 1866 paper reporting 19,959 F₂ outcomes across 7 characters at 2.98:1 and F₃ 193:372 progeny tests); 1900 rediscovery by de Vries, Correns, and Tschermak; William Bateson and Reginald Punnett (1902–1905) at Cambridge coining genetics, allele, homozygote, heterozygote, and the 2×2 Punnett square'
    source: 'Mendel JG (1866) Verhandlungen des naturforschenden Vereines in Brünn 4:3–47; Punnett RC (1905) Mendelism, Cambridge'
    url: https://www.biodiversitylibrary.org/page/40056925
  - what: 'TRUE:Nettie Stevens (1905) mealworm beetle (Tenebrio molitor) XX/XY karyotype discovery at Bryn Mawr College; Thomas Hunt Morgan (1910) white-eyed male Drosophila melanogaster sex-linked inheritance proof in the Columbia University Fly Room; L. D. Sanghvi (1949–1970s) human genetics surveys of ABO/Rh blood groups, X-linked colour vision and G6PD deficiency, and haemoglobinopathies at the Indian Cancer Research Centre in Parel, Mumbai'
    source: 'Stevens NM (1905) Carnegie Inst Wash Publ 36:1–32; Morgan TH (1910) Science 32:120–122; Sanghvi LD, Khanolkar VR (1949) Annals of Eugenics 15(1):52–76'
    url: https://doi.org/10.1126/science.32.812.120
  figures: []
  licence: Original prose CC BY-NC-SA 4.0; historical primary papers cited for documented facts only; no photographs, quotes or art copied.
  truth_status: 'TRUE documented places (St Thomas''s Abbey Brno, University of Vienna, University of Cambridge, Bryn Mawr College, Schermerhorn Hall Columbia University New York, Indian Cancer Research Centre Parel Mumbai), dates (1851–1853, 1856–1863, 1865, 1866, 1900, 1905, 1910, 1933, 1949), and quantitative results (19,959 F₂ outcomes, 5,474:1,850 round/wrinkled, 6,022:2,001 yellow/green, 705:224 purple/white, 193:372 F₃ seed test, 1,237 red plus three white-eyed male F₁ and 3,470:782 F₂ Drosophila counts). No invented dialogue; garden scenes are illustrative reconstructions of documented methods.'
  access_limits: Mendel 1866, Punnett 1905, Stevens 1905, and Morgan 1910 examined via Biodiversity Heritage Library / open-access archives; Bhattacharyya et al. 1990, Yamamoto et al. 1990, and Sanghvi & Khanolkar 1949 verified via primary bibliometric records.

