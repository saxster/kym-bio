    identities and structure-before-lipase order; implemented. Both optional suggestions adopted: chosen3cm activity
    ball and explicit omitted head-group atom disclosure in cartoon. Full formula account unchanged. See grounding/ch07.md
    and final independent confirmations.'
  mobile_correction: Initial final-book acceptance found real390px overflow in the absorption supply slider. Shortened
    label to Marked portions and updated matching explicit tour control names; retained abstract-unit disclosure.
    No shared CSS/engine or model mathematics changed. Full rebuilt acceptance and independent reconfirmation required.
  dark_visual_correction: Direct dark-theme image inspection found weak washed-shape contrast. Added theme-token
    outlines to new spheres/tooth layers/folds/epithelial cells, without changing geometry/arrows/text or shared
    CSS. Rebuild, visual and PDF checks and independent reconfirmation required.
  pdf_test_correction: Exploratory browser checks passed, then PDF-caption locator failed because layout extraction
    interleaved margin-note text and used typographic apostrophes/wrapped hyphens. Added raw reading-order extraction,
    retained layout text and strengthened assertion to entire-caption unique matching with typography-only normalisation.
    No product defect or weakened assertion; rerun full suite on final outlined build.
  pdf_geometry_correction: Native PDF inspection found c7_protection cell-row loop generated a ninth rectangle past
    the viewBox edge. Limited it to eight complete illustrative cells; no biological count, mechanism or text changed.
    Added actual browser SVG shape-bounds assertions (rect/circle/ellipse/path/line/polygon/polyline) and required
    rebuilt verification/review. Also corrected PDF renderer subprocess argument1500 from integer to string; that
    was a harness error, not a product change.
  multi_open_print_check: 'Supplementary pre-pagination visibility and unnormalised raw-title probes initially suggested
    a print defect. This was a setup error: actual first PDF contains every complete caption and all three drawing
    titles after typography/spacing normalisation, and pagination restores originals. Temporary candidate print
    stylesheet removed; no shared engine change. QA now exports with all three widgets open and checks actual originals/captions
    afterwards.'
