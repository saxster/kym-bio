story:meselson-flemming-gurdon-divisions:
  ocw: []
  openstax: []
  research: []
  history:
  - what: 'TRUE:Walther Flemming (1879–1882) aniline-dye staining of fire salamander larvae (Salamandra maculosa) at the University of Kiel revealing chromatin and longitudinal chromosome splitting in mitosis; Matthew Meselson and Franklin W. Stahl (1954 Woods Hole meeting; 1957–1958 Caltech PNAS 44:671–682) ¹⁵N/¹⁴N CsCl density-gradient ultracentrifugation at ~140,000 × g proving semi-conservative DNA replication (1.724, 1.717, 1.710 g/cm³)'
    source: Flemming W (1882) Zellsubstanz, Kern und Zelltheilung; Meselson M, Stahl FW (1958) PNAS 44(7):671–682, PMC528642
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC528642/
  - what: 'TRUE:John B. Gurdon (1962) Xenopus laevis tadpole intestinal epithelial nuclear transfer at the University of Oxford proving genomic equivalence in differentiated cells; Kamal Ranadive (1950s–1960s) mammalian tissue-culture laboratory at the Indian Cancer Research Centre in Parel, Mumbai; Kazutoshi Takahashi and Shinya Yamanaka (2006) reprogramming of adult fibroblasts into induced pluripotent stem cells (iPSCs) with Oct4, Sox2, Klf4, and c-Myc at Kyoto University'
    source: Gurdon JB (1962) Journal of Embryology and Experimental Morphology 10(4):622–640; Takahashi K, Yamanaka S (2006) Cell 126(4):663–676
    url: https://doi.org/10.1016/j.cell.2006.07.024
  figures: []
  licence: Original prose CC BY-NC-SA 4.0; historical primary papers cited for documented facts only; no photographs, quotes or art copied.
  truth_status: 'TRUE documented places (University of Kiel, Marine Biological Laboratory Woods Hole, Caltech Pasadena, University of Oxford, Indian Cancer Research Centre Parel Mumbai, Kyoto University), dates (1879, 1882, April 1953, summer 1954, July 1958, 1962, 2006, 2012), experimental parameters (14 generations in ¹⁵NH₄Cl at 36 °C, CsCl centrifugation at 44,770 rpm / ~140,000 × g, buoyant densities 1.724, 1.717, and 1.710 g/cm³), and reprogramming transcription factors (Oct4, Sox2, Klf4, c-Myc). No invented dialogue or scenes.'
  access_limits: Meselson & Stahl 1958 (PMC528642) and Flemming 1882 examined via open-access archives; Gurdon 1962, Takahashi & Yamanaka 2006, and Janaki Ammal 1938/1945 verified via primary bibliometric records and Nobel Lecture archives.

