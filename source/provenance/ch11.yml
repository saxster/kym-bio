story:franklin-khorana-codebreakers:
  ocw: []
  openstax: []
  research: []
  history:
  - what: TRUE:Erwin Chargaff (1950) paper chromatography and UV spectrophotometry proving %A ≈ %T and %G ≈ %C across double-stranded cellular DNA while species differ in (A+T)/(G+C); Rosalind Franklin and Raymond Gosling (May 1952 / April 1953) hydrated B-form DNA X-ray diffraction (Photo 51) at King's College London showing a helical X-cross, 3.4 nm turn, 0.34 nm base spacing (10 bp/turn), missing 4th layer line, and outside phosphates on a 2.0 nm cylinder; James Watson and Francis Crick (April 1953) antiparallel double-helix model with complementary A=T and C≡G base pairing aided by Jerry Donohue's keto tautomer insight
    source: Chargaff E (1950) Experientia 6(6):201–209; Franklin RE, Gosling RG (1953) Nature 171(4356):740–741; Watson JD, Crick FHC (1953) Nature 171(4356):737–738
    url: https://doi.org/10.1038/171740a0
  - what: TRUE:Francis Crick, Sydney Brenner, Leslie Barnett, and R. J. Watts-Tobin (1961) phage T4 rII frameshift proof (+1/+2/+3); Marshall Nirenberg and Heinrich Matthaei (May 1961) cell-free poly-U translation into polyphenylalanine (UUU = Phe); Har Gobind Khorana (born 1922 in Raipur, Punjab; educated at D.A.V. High School Multan, Punjab University Lahore under Mahan Singh, Liverpool, Zurich, and Cambridge) chemical and enzymatic synthesis of repeating copolymers ((UC)ₙ → Ser–Leu, (UG)ₙ → Cys–Val, (AG)ₙ → Arg–Glu, (AC)ₙ → Thr–His, and (UAG)ₙ nonsense stop codons) at the University of Wisconsin–Madison completing the 64-codon genetic code
    source: Crick FHC et al. (1961) Nature 192:1227–1232; Nirenberg MW, Matthaei JH (1961) PNAS 47:1588–1602, PMC223178; Nishimura S, Jones DS, Khorana HG (1965) Journal of Molecular Biology 13(1):302–324; Khorana HG (1968) Nucleic acid synthesis in the study of the genetic code, Nobel Lecture, 12 December 1968
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC223178/
  figures: []
  licence: Original prose CC BY-NC-SA 4.0; historical primary papers cited for documented facts only; no photographs, quotes or art copied.
  truth_status: 'TRUE documented places (Columbia University New York, King''s College London, Cavendish Laboratory Cambridge, Raipur in Punjab, Multan, Punjab University Lahore, NIH Bethesda, University of Wisconsin–Madison), dates (1944, 1950, May 1952, 25 April 1953, April 1958, May and December 1961, 1964–1968), crystallographic dimensions (3.4 nm pitch, 0.34 nm step, 10 bp/turn, 2.0 nm width, 92% relative humidity), and synthetic copolymer sequences ((UC)ₙ → Ser–Leu, (UG)ₙ → Cys–Val, (AG)ₙ → Arg–Glu, (AC)ₙ → Thr–His). No invented dialogue or scenes.'
  access_limits: Avery et al. 1944 (PMC2135445) and Nirenberg & Matthaei 1961 (PMC223178) examined via open-access archives; Franklin & Gosling 1953, Watson & Crick 1953, Chargaff 1950, Crick et al. 1961, and Khorana 1965/1968 verified via primary bibliometric records and published Nobel Lecture archives.

