      Charpentier (2012, Science 337(6096):816–821) demonstrated programmable dual-RNA-guided CRISPR-Cas9 DNA cleavage
    source: Cohen SN, Chang ACY, Boyer HW, Helling RB (1973) PNAS 70(11):3240–3244; Goeddel DV et al. (1979) PNAS
      76(1):106–110; Jinek M et al., Doudna JA, Charpentier E (2012) Science 337(6096):816–821
