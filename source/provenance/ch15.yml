  history:
  - what: TRUE:Ernst Boris Chain, Howard Walter Florey, and Norman George Heatley (1940, Lancet 236(6104):226–228)
      developed penicillin as a treatment; subsequent Peoria research and industrial engineering enabled deep-tank
      mass production; Hindustan Antibiotics was incorporated at Pimpri in 1954 and its plant commissioned in 1955–56;
      SubbaRow died in 1948 and did not launch the plant
    source: Chain E, Florey HW et al. (1940) Penicillin as a chemotherapeutic agent, The Lancet 236(6104):226–228
    url: https://doi.org/10.1016/S0140-6736(01)08728-1
  - what: TRUE:Stanley N. Cohen, Annie C. Y. Chang, Herbert W. Boyer, and Robert B. Helling (1973, PNAS 70(11):3240–3244)
      constructed the first functional bacterial recombinant plasmids in vitro using EcoRI restriction endonuclease
      sticky ends and DNA ligase; David V. Goeddel et al. (1979, PNAS 76(1):106–110) expressed human insulin in
