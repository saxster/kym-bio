'15.1':
  ocw: []
  openstax:
  - book: Biology 2e
    section: 45.1 Population Demography & 45.3 Environmental Limits to Population Growth & 46.1 Ecology of Ecosystems
      & 46.2 Energy Flow through Ecosystems
    url: https://openstax.org/books/biology-2e/pages/46-2-energy-flow-through-ecosystems
    took: Solar energy as principal input to biological systems, one-way non-cyclical energy flow vs cyclical nutrient
      flow, food chains and food webs, trophic levels, pyramids of numbers, dry biomass and energy, the variable
      trophic production efficiency (10% illustrative assumption), separate harvested-food supply comparison before
      human digestion, and four-phase microbial batch population growth curves
  - book: Concepts of Biology
    section: 19.2 Population Growth and Regulation & 20.1 Energy Flow through Ecosystems
    url: https://openstax.org/books/concepts-of-biology/pages/20-1-energy-flow-through-ecosystems
    took: Accessible explanation of trophic efficiency, energy losses in respiration/faeces/urine, and carrying
      capacity K
  research:
  - what: 'Core/Supplement placement independently checked: Topic 19.1 Energy flow (Core 19.1.1–19.1.2: Sun as principal
      source of energy input; energy flow through living organisms including light energy from the Sun and chemical
      energy in organisms, eventually transferred to the environment as heat), Topic 19.2 Food chains and food webs
      (Core 19.2.1–19.2.15 & Supplement 19.2.16–19.2.19: food chain, food web, producer, consumer, herbivore, carnivore,
      decomposer, trophic level; pyramids of numbers, biomass and energy; why energy transfer between trophic levels
      is inefficient, why food chains usually have fewer than 5 trophic levels, and why supplying humans with crop
      plants is more energy-efficient than feeding crops to livestock), and Topic 19.4 Populations (Core 19.4.1–19.4.4
      & Supplement 19.4.5–19.4.6: population, community, ecosystem; factors affecting population growth rate; lag,
      exponential/log, stationary, and death phases of sigmoid population growth curves and limiting factors)'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
    url: https://www.cambridgeinternational.org/Images/697203-2026-2028-syllabus.pdf
  - what: 'Word origin only, not mechanism evidence: trophic (from Greek trophe, nourishment), ecosystem, biomass'
    source: Wiktionary / etymological entries
    url: https://en.wiktionary.org/wiki/trophic
  - what: Production transfer vs assimilation; food-supply denominator
    source: Primary paper, original record or authoritative source inspected during 1 November 2026 revision
    url: https://www.fao.org/4/AA040E/AA040E08.htm
  - what: Empirical variation in trophic transfer
    source: Primary paper, original record or authoritative source inspected during 1 November 2026 revision
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13330895/
  - what: Human growth rate is slowing
    source: Primary paper, original record or authoritative source inspected during 1 November 2026 revision
    url: https://www.census.gov/library/stories/2023/11/world-population-estimated-eight-billion.html
  history:
  - what: TRUE:Charles S. Elton (1927, Animal Ecology) defined food chains, food cycles (webs), ecological niches,
      and the pyramid of numbers; Raymond L. Lindeman (1942, Ecology 23(4):399–417, working with Eleanor Hall at
      Cedar Creek Bog, Minnesota) established the thermodynamic trophic-dynamic energy budget drawing together trophic
      production and respiration evidence; the manuscript uses 10% only as a stated illustrative assumption
    source: Elton CS (1927) Animal Ecology, Sidgwick & Jackson, London; Lindeman RL (1942) The trophic-dynamic aspect
      of ecology, Ecology 23(4):399–417
    url: https://doi.org/10.2307/1930126
  figures:
  - name: c15_food_webs_trophic_pyramids
    origin: ours; original semantic-theme schematic code in figs_ch15.py; no source illustrations or photographs
    limits: Not to scale; Sanjay Gandhi National Park food web and comparison of pyramids of numbers, dry biomass,
      and energy for one giant banyan tree
  - name: c15_energy_budget_sigmoid_growth
    origin: ours; original semantic-theme schematic code in figs_ch15.py; no source illustrations or photographs
    limits: Not to scale; chosen illustrative inter-level energy allocation, crop harvest food-supply routes before
      human digestion, and 4-phase sigmoid population growth curve
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under
    recorded series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party
    research, dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: 'Illustrative production cascades at selected 5–20% efficiencies; loss ledger closes heat + detritus
    + final production without double counting. Food-supply budget excludes human digestion: direct 10,000 kJ vs
    livestock route 1,000 kJ at stated 10% conversion. Energy per area does not assert population viability. tests/ch15_domain.mjs
    includes independent boundary regressions.'
  scope: Bridges directly from Chapter 14's closing evolutionary prompt to ecosystem energy flow, food webs, ecological
    pyramids, dietary efficiency, and population regulation.
'15.2':
  ocw: []
  openstax:
  - book: Biology 2e
    section: 46.3 Biogeochemical Cycles & 31.2 The Soil & 31.3 Nutritional Adaptations of Plants
    url: https://openstax.org/books/biology-2e/pages/46-3-biogeochemical-cycles
    took: The water cycle (evaporation, transpiration, condensation, precipitation), the carbon cycle (photosynthesis,
      respiration, feeding, decomposition, fossilisation, combustion), the nitrogen cycle (nitrogen fixation by
      Rhizobium, Azotobacter and lightning, root hair active transport of NO3-, assimilation, feeding, liver deamination
      to urea, ammonification, two-step aerobic nitrification NH4+ to NO2- to NO3-, and anaerobic denitrification
      NO3- to N2), and legume root nodule mutualism with leghaemoglobin
  - book: Concepts of Biology
    section: 20.2 Biogeochemical Cycles
    url: https://openstax.org/books/concepts-of-biology/pages/20-2-biogeochemical-cycles
    took: Accessible overview of carbon, water, and nitrogen cycling between biotic and abiotic reservoirs
  research:
  - what: 'Core/Supplement placement independently checked: Topic 19.3 Nutrient cycles (Core 19.3.1: describe the
      carbon cycle limited to photosynthesis, respiration, feeding, decomposition, formation of fossil fuels and
      combustion; Core 19.3.2: describe the water cycle limited to evaporation, transpiration, condensation and
      precipitation; Supplement 19.3.3: describe the nitrogen cycle with reference to decomposition of plant and
      animal protein to ammonium ions, nitrification, nitrogen fixation by lightning and bacteria, absorption of
      nitrate ions by plants, production of amino acids and proteins, feeding and digestion of proteins, deamination,
      and denitrification; Supplement 19.3.4: state the roles of microorganisms in the nitrogen cycle limited to
      decomposition, nitrification, nitrogen fixation and denitrification)'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
    url: https://www.cambridgeinternational.org/Images/697203-2026-2028-syllabus.pdf
  - what: 'Word origin only, not mechanism evidence: legume, Rhizobium (from Greek rhiza, root + bios, life), nitrification'
    source: Wiktionary / etymological entries
    url: https://en.wiktionary.org/wiki/Rhizobium
  - what: Carbonate rock forms by a separate route from fossil fuels
    source: Primary paper, original record or authoritative source inspected during 1 November 2026 revision
    url: https://gml.noaa.gov/outreach/carbon_toolkit/
  history:
  - what: TRUE:Martinus Willem Beijerinck (1888, Botanische Zeitung 46:725–804; 1901) isolated symbiotic root-nodule
      Rhizobium leguminosarum and free-living soil Azotobacter chroococcum; Sergei Nikolaievich Winogradsky (1890–1891,
      Annales de l'Institut Pasteur 4:213–231, 257–275, 760–771) discovered chemolithoautotrophy and isolated the
      two aerobic nitrifying bacterial guilds Nitrosomonas (NH4+ to NO2-) and Nitrobacter (NO2- to NO3-); Charles
      David Keeling (1958–1960, Tellus 12(2):200–203) established continuous infrared CO2 measurements at Mauna
      Loa Observatory, Hawaii
    source: Beijerinck MW (1888) Die Bakterien der Papilionaceenknöllchen, Bot Ztg 46:725–804; Winogradsky S (1890)
      Recherches sur les organismes de la nitrification, Ann Inst Pasteur 4:213–231; Keeling CD (1960) The concentration
      and isotopic abundances of carbon dioxide in the atmosphere, Tellus 12(2):200–203
    url: https://doi.org/10.3402/tellusa.v12i2.9366
  figures:
  - name: c15_carbon_water_cycles
    origin: ours; original semantic-theme schematic code in figs_ch15.py; no source illustrations or photographs
    limits: Not to scale; coupled Mumbai-Western Ghats water cycle, global carbon cycle, and Mauna Loa Keeling CO2
      curve (1958–2026)
  - name: c15_nitrogen_cycle_legumes
    origin: ours; original semantic-theme schematic code in figs_ch15.py; no source illustrations or photographs
    limits: Not to scale; complete 5-stage nitrogen cycle diagram with four bacterial guilds and legume root nodule
      mutualism
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under
    recorded series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party
    research, dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: Soil nitrogen guild fluxes (Rhizobium fixation 0–180 kg N/ha/yr, ammonification, aerobic nitrification,
    anaerobic denitrification in waterlogged soil, soil [NO3-] and plant protein yield) and global carbon fluxes
    / Keeling CO2 trajectory computed in source/live/biosphere_biotech_model.js and verified in tests/ch15_domain.mjs.
  scope: Water/carbon/nitrogen matter transfers, distinct biological/lightning/industrial nitrogen fixation routes,
    microbial roles, soil oxygen and qualified inference from plots. No claim that every mineral chemical form cycles
    unchanged.
'15.3':
