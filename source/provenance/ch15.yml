  - what: TRUE:Charles Elton (1927, Animal Ecology) introduced food chains and the pyramid of numbers; Raymond Lindeman
      (1942, Ecology 23(4):399–417, working with Eleanor Hall at Cedar Creek Bog, Minnesota) measured annual trophic
      energy flow and helped establish trophic energy accounting; 10% is a model assumption, not a universal proven
      rule; Sergei Winogradsky (1890) isolated Nitrosomonas and Nitrobacter in soil nitrification; Martinus Beijerinck
      (1888, 1901) isolated symbiotic Rhizobium and free-living Azotobacter; Charles David Keeling (1958–1960) established
      the Mauna Loa CO2 curve; Rachel Carson (1962, Silent Spring) documented food-chain biomagnification of DDT;
      E. K. Janaki Ammal, Salim Ali, and Madhav Gadgil helped protect Silent Valley (dam abandoned 1983; formal
      park notification 1984)
    source: Elton CS (1927) Animal Ecology; Lindeman RL (1942) Ecology 23:399–417; Winogradsky S (1890) Ann Inst
      Pasteur 4:213–231; Beijerinck MW (1888) Bot Ztg 46:725–804; Keeling CD (1960) Tellus 12:200–203; Carson RL
      (1962) Silent Spring
    url: https://doi.org/10.2307/1930126
  - what: TRUE:Ernst Chain, Howard Florey, and Norman Heatley (1940–1941) purified penicillin and spurred deep-tank
      aerated industrial fermentation, followed by Hindustan Antibiotics Limited at Pimpri near Pune (1954); Herbert
      Boyer and Stanley Cohen (1973, PNAS 70:3240–3244) created the first recombinant plasmids using EcoRI restriction
      enzyme sticky ends and DNA ligase, leading to recombinant human insulin in E. coli (1978–1982); Jennifer Doudna
      and Emmanuelle Charpentier (2012, Science 337:816–821) demonstrated programmable guide-RNA CRISPR-Cas9 DNA
      editing
    source: Chain E, Florey HW et al. (1940) Lancet 236:226–228; Cohen SN, Chang ACY, Boyer HW, Helling RB (1973)
      PNAS 70:3240–3244; Jinek M et al., Doudna JA, Charpentier E (2012) Science 337:816–821
    url: https://doi.org/10.1126/science.1225829
