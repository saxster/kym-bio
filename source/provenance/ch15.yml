  - book: Biology 2e
    section: 17.1 Biotechnology & 22.5 Beneficial Prokaryotes
    url: https://openstax.org/books/biology-2e/pages/17-1-biotechnology
    took: Why bacteria are useful in biotechnology and genetic modification (rapid reproduction, complex molecules,
      few ethical concerns, plasmids), yeast anaerobic respiration in bread-making and biofuels, pectinase in fruit
      juice production, biological washing powders, immobilised lactase for lactose-free milk, illustrative fermenter
      response with process-specific controls and waste handling engineering, prepared intron-free coding DNA, compatible-end
      recombinant plasmid human insulin synthesis (restriction enzymes, sticky ends, DNA ligase), GM crops (Bt cotton/maize,
      herbicide-resistant soya, Golden Rice), selective breeding vs GM comparison, and CRISPR-Cas9 genome editing
  - book: Concepts of Biology
    section: 10.1 Cloning and Genetic Engineering & 10.2 Biotechnology in Medicine and Agriculture
    url: https://openstax.org/books/concepts-of-biology/pages/10-1-cloning-and-genetic-engineering
    took: Accessible explanation of restriction enzymes, sticky ends, DNA ligase, recombinant plasmids, and transgenic
      crops
  research:
  - what: 'Core/Supplement placement independently checked: Topic 21.1 Use of bacteria in biotechnology and genetic
      modification (Core 21.1.1 & Supplement 21.1.2: rapid reproduction rate, ability to make complex molecules,
      few ethical concerns over manipulation and growth, presence of plasmids), Topic 21.2 Biotechnology (Core 21.2.1–21.2.4
      & Supplement 21.2.5–21.2.6: yeast in biofuel and bread-making; pectinase in fruit juice production; biological
      washing powders; lactase for lactose-free milk; industrial fermenters for penicillin, mycoprotein and insulin
      controlling temperature, pH, oxygen, nutrient supply and waste products), and Topic 21.3 Genetic modification
      (Core 21.3.1–21.3.2 & Supplement 21.3.3–21.3.4: genetic modification definition; examples in crop plants including
      insect resistance, herbicide resistance and Vitamin A Golden Rice; 5-step human insulin production using restriction
