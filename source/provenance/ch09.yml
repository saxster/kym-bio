story:siddiqi-para-channels:
  ocw: []
  openstax: []
  research: []
  history:
  - what: TRUE:1921 Graz two-frog-heart Ringer perfusion experiment by Otto Loewi demonstrating chemical vagal inhibition
      (Vagusstoff / acetylcholine)
    source: Loewi O (1921) Über humorale Übertragbarkeit der Herznervenwirkung, Pflügers Archiv 189:239–242; Nobel Lecture
      1936 examined
    url: https://www.nobelprize.org/prizes/medicine/1936/loewi/lecture/
  - what: TRUE:1939 Plymouth Marine Biological Laboratory intracellular recording in Loligo forbesii giant axon and 1952
      quantitative voltage-clamp separation of Na+ and K+ currents by Alan Hodgkin and Andrew Huxley
    source: Hodgkin AL, Huxley AF (1939) Nature 144:710–711; Hodgkin AL, Huxley AF (1952) Journal of Physiology 117(4):500–544,
      PMID 12991237 / PMC1392413; primary papers examined
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1392413/
  - what: TRUE:Obaid Siddiqi (born 1932 Basti district, UP; Aligarh Muslim University; Glasgow PhD with Guido Pontecorvo;
      founded Molecular Biology Unit at TIFR Colaba, Mumbai in 1962 on Homi Bhabha's invitation; later National Centre
      for Biological Sciences, Bengaluru); 1971 isolation of para^ts by David Suzuki, Thomas Grigliatti and Roderick Williamson;
      1976 electrophysiological dissection of para, shi and com mutants in Drosophila by Obaid Siddiqi and Seymour Benzer
      (*PNAS* 73:3253–3257); 1989 molecular cloning of the para locus as the voltage-gated Na+ channel alpha-subunit gene
      by Loughney, Kreber & Ganetzky
    source: Suzuki DT et al. (1971) PNAS 68(5):890–893 (PMID 5280526); Siddiqi O, Benzer S (1976) PNAS 73(9):3253–3257
      (PMID 184469 / PMC431023); Loughney K, Kreber R, Ganetzky B (1989) Cell 58(6):1143–1154 (PMID 2550145); Vijayaraghavan
      K (2013) Current Science / Science obituary of Obaid Siddiqi examined
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC431023/
  figures: []
  licence: Original prose CC BY-NC-SA 4.0; historical primary papers cited for documented facts only; no photographs, quotes
    or art copied.
  truth_status: TRUE documented places (Graz, Plymouth, TIFR Colaba in Mumbai, Caltech in Pasadena), dates (1921, 1939,
    1952, 1962, 1971, 1976, 1989), experimental apparatus and physiological findings. No invented dialogue, thoughts or
    scenes; properly distinguishes Suzuki's 1971 mutant isolation, Siddiqi & Benzer's 1976 electrophysiological dissection,
    and Loughney et al.'s 1989 molecular cloning.
  access_limits: Primary papers Hodgkin & Huxley 1952 (PMC1392413) and Siddiqi & Benzer 1976 (PMC431023) examined in full;
    Loewi 1921, Suzuki 1971 and Loughney 1989 verified via PubMed abstracts and Nobel/biographical records.
