'9.1':
  ocw: []
  openstax:
  - book: Biology 2e
    section: 35.1 Neurons and Glial Cells
    url: https://openstax.org/books/biology-2e/pages/35-1-neurons-and-glial-cells
    took: Neurone cellular architecture and electrical impulse framing across central and peripheral divisions
  - book: Biology 2e
    section: 35.3 The Central Nervous System
    url: https://openstax.org/books/biology-2e/pages/35-3-the-central-nervous-system
    took: Brain and spinal cord as the central nervous system (CNS)
  - book: Biology 2e
    section: 35.4 The Peripheral Nervous System
    url: https://openstax.org/books/biology-2e/pages/35-4-the-peripheral-nervous-system
    took: Nerves outside the brain and spinal cord as the peripheral nervous system (PNS)
  - book: Biology 2e
    section: 37.1 Types of Hormones
    url: https://openstax.org/books/biology-2e/pages/37-1-types-of-hormones
    took: Endocrine ductless secretion into blood plasma and receptor-mediated target-organ specificity
  - book: Biology 2e
    section: 37.2 How Hormones Work
    url: https://openstax.org/books/biology-2e/pages/37-2-how-hormones-work
    took: Complementary target-cell receptors and nervous versus endocrine comparison in speed and duration
  - book: Biology 2e
    section: 37.5 Endocrine Glands
    url: https://openstax.org/books/biology-2e/pages/37-5-endocrine-glands
    took: Adrenal glands (adrenaline), pancreas (insulin and glucagon), testes (testosterone) and ovaries (oestrogen)
  research:
  - what: 'Core/Supplement placement independently checked: Topic 14.1 Coordination and response (14.1.1–14.1.3) and Topic
      14.3 Hormones (14.3.1–14.3.6), printed pp 30–32'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
    url: https://www.cambridgeinternational.org/Images/697203-2026-2028-syllabus.pdf
  - what: Nervous versus endocrine coordination speed, duration, pathway and target specificity; adrenal fight-or-flight
      effects (heart rate, breathing rate, pupil dilation, hepatic glycogenolysis to glucose)
    source: OpenStax Anatomy and Physiology 2e (J. Gordon Betts et al.), §§12.1, 17.1–17.2, 17.6; corroborating physiological
      facts, no copied prose or source art
    url: https://openstax.org/books/anatomy-and-physiology-2e/pages/17-1-an-overview-of- the-endocrine-system
  - what: 0893 biology/scientific thinking level fit only; full framework not publicly inspected, no exact objective
      codes asserted
    source: Cambridge official Lower Secondary Science 0893 overview
    url: https://www.cambridgeinternational.org/programmes-and-qualifications/cambridge-lower-secondary/curriculum/science/
  - what: 'Word origin only, not mechanism evidence: stimulus, hormone, endocrine, adrenaline, insulin, glucagon'
    source: Wiktionary / etymological entries examined via MediaWiki API
    url: https://en.wiktionary.org/wiki/hormone
  history:
  - what: TRUE:1902 experiment on an anaesthetised dog jejunal loop with severed mesenteric nerves; dilute HCl placed in
      the lumen still triggered pancreatic juice secretion; intravenous injection of an acid-mucosal extract (secretin)
      reproduced the response, establishing blood-borne chemical coordination; Starling (1905 Croonian Lectures) coined
      hormone from Greek horman ('to set in motion / arouse')
    source: Bayliss WM, Starling EH (1902), The mechanism of pancreatic secretion, Journal of Physiology 28(5):325–353,
      PMID 16992627 / PMC1540572; primary paper examined
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1540572/
  figures:
  - name: c9_nerves_vs_hormones
    origin: ours; original semantic-theme schematic code in figs_ch09.py; no source illustrations or photographs
    limits: Not to scale; schematic side-by-side comparison of point-to-point neural wiring (CNS/PNS) with bloodstream
      hormone broadcast and complementary target-organ receptors, plus major endocrine gland locator
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under recorded
    series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party research,
    dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: 'Pathway latency budget: spinal reflex ~43 ms vs voluntary visual catch ~185 ms vs bloodstream adrenaline ~15,000
    ms. Free-fall ruler drop d = 1/2 g t^2 with g = 980 cm/s^2: at t = 0.1853 s, d = 16.8 cm (~17 cm); at d = 18 cm, t =
    sqrt(2 × 0.18 / 9.8) = 0.192 s (192 ms); at d = 20 cm, t = 202 ms. Verified in tests/ch09_domain.mjs.'
  activity: One seated or standing ruler-drop reaction-time activity with a partner using a 30 cm ruler, paper and pencil;
    safe classroom/home activity reviewed for feasibility, not physically trialled.
  scope: Introduces insulin, glucagon, adrenaline, testosterone and oestrogen at Topic 14.3 scope; reserves negative-feedback
    blood-glucose homeostasis, Type 1 diabetes and skin thermoregulation for Chapter 10 (Topic 14.4).
'9.2':
  ocw: []
  openstax:
  - book: Biology 2e
    section: 35.1 Neurons and Glial Cells
    url: https://openstax.org/books/biology-2e/pages/35-1-neurons-and-glial-cells
    took: Sensory, relay (interneurone) and motor neurone morphology, dendrites, cell body, axon, myelin sheath and nodes
      of Ranvier
  - book: Biology 2e
    section: 35.2 How Neurons Communicate
    url: https://openstax.org/books/biology-2e/pages/35-2-how-neurons-communicate
    took: Resting membrane potential (-70 mV), threshold (-55 mV), voltage-gated Na+ depolarisation (+30 mV), voltage-gated
      K+ repolarisation, refractory period, saltatory conduction, and chemical synaptic transmission across the synaptic
      cleft
  research:
  - what: 'Core/Supplement placement independently checked: Topic 14.1 Coordination and response (14.1.4–14.1.11: sensory,
      relay and motor neurones, reflex arc, reflex action, synapse structure, neurotransmitter diffusion across synaptic
      cleft, receptor binding, impulse stimulation and one-way transmission), printed pp 30–31'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
    url: https://www.cambridgeinternational.org/Images/697203-2026-2028-syllabus.pdf
  - what: Action potential ion fluxes, myelinated vs unmyelinated conduction speeds, cholinergic neuromuscular/autonomic
      synaptic steps, and acetylcholinesterase termination vs organophosphate/carbamate inhibition
    source: OpenStax Anatomy and Physiology 2e (J. Gordon Betts et al.), §§12.2–12.5; corroborating physiological facts,
      no copied prose or source art
    url: https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential
  - what: Cross-book reference to electron drift (~0.1 mm/s) versus electric field establishment (~2 × 10^8 m/s) in a copper
      wire (Chapter 12, Section 12.2)
    source: The Moving World (Book 2 of Kym's science series), source/src/ch12.md inspected directly
    url: https://openstax.org/books/physics/pages/1-introduction
  - what: 'Tetrodotoxin (TTX) mechanism: selective extracellular pore blockade of voltage-gated Na+ channels in lobster
      giant axons without altering resting potential or K+ conductance; clinical progression from perioral paraesthesia
      to diaphragmatic/intercostal respiratory paralysis and survival by mechanical ventilation'
    source: Narahashi T, Moore JW, Scott WR (1964), Tetrodotoxin blockage of sodium conductance increase in lobster giant
      axons, Journal of General Physiology 47(5):965–974, PMID 14155438 / PMC2195365; primary paper examined
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2195365/
  - what: 'Word origin only, not mechanism evidence: neurone, dendrite, axon, myelin, reflex, synapse'
    source: Wiktionary / etymological entries examined via MediaWiki API
    url: https://en.wiktionary.org/wiki/synapse
  history:
  - what: TRUE:1939 Plymouth intracelluar microelectrode recording in Loligo forbesii giant axon showing action potential
      overshoot above 0 mV; 1952 voltage-clamp separation of inward Na+ current and outward K+ current and quantitative
      reconstruction of the action potential
    source: Hodgkin AL, Huxley AF (1939) Nature 144:710–711; Hodgkin AL, Huxley AF (1952) Journal of Physiology 117(4):500–544,
      PMID 12991237 / PMC1392413; primary papers examined
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1392413/
  - what: TRUE:1971 isolation of temperature-sensitive paralytic (para^ts) Drosophila mutant by Suzuki, Grigliatti & Williamson;
      1976 electrophysiological dissection by Obaid Siddiqi (founder of the Molecular Biology Unit at TIFR Colaba, Mumbai
      in 1962) and Seymour Benzer showing reversible loss of axonal action potentials in para above ~30 °C while direct
      muscle excitability persisted and shi/com blocked synaptic transmission; 1989 cloning of the para locus as the
      structural voltage-gated Na+ channel alpha-subunit gene by Loughney, Kreber & Ganetzky
    source: Suzuki DT, Grigliatti T, Williamson R (1971) PNAS 68(5):890–893 (PMID 5280526); Siddiqi O, Benzer S (1976)
      PNAS 73(9):3253–3257 (PMID 184469 / PMC431023); Loughney K, Kreber R, Ganetzky B (1989) Cell 58(6):1143–1154 (PMID
      2550145); primary papers examined
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC431023/
  - what: TRUE:1921 isolated two-frog-heart Ringer perfusion experiment in Graz demonstrating chemical vagal inhibition
      (Vagusstoff, acetylcholine) by Otto Loewi; 1950s–1970s vesicular quantal release and presynaptic Ca2+ requirement
      by Bernard Katz and colleagues
    source: Loewi O (1921) Pflügers Archiv 189:239–242; Katz B (1969) The Release of Neural Transmitter Substances; historical
      and physiological literature examined
    url: https://www.nobelprize.org/prizes/medicine/1936/loewi/lecture/
  figures:
  - name: c9_neurone_types_reflex
    origin: ours; original semantic-theme schematic code in figs_ch09.py; no source illustrations or photographs
    limits: Not to scale; compares sensory, relay and motor neurone geometries above a transverse spinal-cord withdrawal
      reflex arc
  - name: c9_action_potential_wave
    origin: ours; original semantic-theme schematic code in figs_ch09.py; no source illustrations or photographs
    limits: Not to scale; contrasts copper-wire electron conduction with transmembrane Na+/K+ action-potential propagation
      and shows Siddiqi & Benzer's 1976 para^ts recordings at 22 °C versus 32 °C
  - name: c9_synapse_relay
    origin: ours; original semantic-theme schematic code in figs_ch09.py; no source illustrations or photographs
    limits: Not to scale; schematic 20 nm chemical synaptic cleft showing vesicles, neurotransmitter diffusion, postsynaptic
      receptors, one-way structural asymmetry and enzymatic clearance
  - name: c9_pathway_latency_budget
    origin: ours; original semantic-theme schematic code in figs_ch09.py; no source illustrations or photographs
    limits: Not to scale; compares total latency across spinal withdrawal reflex (~35 ms), voluntary ruler catch (~190
      ms), endocrine blood broadcast (~5–30 s) and plant auxin bending (~20–120 min)
  - name: c9_tetrodotoxin_case
    origin: ours; original semantic-theme schematic code in figs_ch09.py; no source illustrations or photographs
    limits: Not to scale; compares open voltage-gated Na+ pore (+30 mV spike) with extracellular TTX guanidinium plug (flatline
      at -70 mV) and clinical progression to phrenic/intercostal motor block
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under recorded
    series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party research,
    dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: 'Axon conduction latency t = L / v: at L = 0.75 m, myelinated v = 60 m/s -> 12.5 ms; unmyelinated v = 2 m/s
    -> 375 ms. Synaptic diffusion time across x = 20 nm at D = 500 µm²/s: t ≈ x²/(2D) = 0.0004 ms (plus vesicle release
    and binding -> ~0.5 ms total). Verified in tests/ch09_domain.mjs.'
  scope: Explicitly distinguishes sideways transmembrane Na+/K+ ion movement during an action potential from electron drift
    in a copper wire; teaches the 4-stage action potential and Siddiqi's TIFR/Caltech para^ts bridge without mathematical
    differential equations; TTX case is diagnostic reasoning, not personal medical advice.
