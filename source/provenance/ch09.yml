  - name: c9_pupil_and_accommodation
    origin: ours; original semantic-theme schematic code in figs_ch09.py; no source illustrations or photographs
    limits: Not to scale; compares antagonistic iris circular/radial muscles in bright versus dim light (top) and ciliary
