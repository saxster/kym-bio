'9.4':
  ocw: []
  openstax:
  - book: Biology 2e
    section: 30.6 Plant Sensory Systems and Responses
    url: https://openstax.org/books/biology-2e/pages/30-6-plant-sensory-systems-and-responses
    took: Phototropism, gravitropism, coleoptile tip perception, auxin redistribution to the shaded/lower side, differential
      cell elongation in shoots versus inhibition in roots
  research:
  - what: 'Core/Supplement placement independently checked: Topic 14.5 Tropic responses (14.5.1–14.5.5: gravitropism, phototropism,
      positive and negative tropic responses in shoots and roots, and the chemical control of plant growth by auxin: made
      in shoot tip, diffuses through plant, unequally distributed in response to light and gravity, stimulates cell elongation
      in shoots), printed p 33'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
    url: https://www.cambridgeinternational.org/Images/697203-2026-2028-syllabus.pdf
  - what: Opposite auxin sensitivity in roots versus shoots (higher auxin concentration on the lower side of a horizontal
      root inhibits cell elongation so the upper side elongates faster and the root bends downward)
    source: Taiz L et al., Plant Physiology and Development, and OpenStax Biology 2e §30.6; corroborating plant-physiology
      facts, no copied prose or source art
    url: https://openstax.org/books/biology-2e/pages/30-6-plant-sensory-systems-and-responses
  - what: 'Word origin only, not mechanism evidence: tropism, phototropism, gravitropism, auxin, coleoptile'
    source: Wiktionary / etymological entries examined via MediaWiki API
    url: https://en.wiktionary.org/wiki/auxin
  history:
  - what: TRUE:1880 coleoptile experiments showing that excising or covering the shoot tip with an opaque cap prevents
      phototropic bending in the elongation zone below; 1913 Boysen-Jensen demonstration that the signal crosses a water-permeable
      gelatin block on the shaded side but is blocked by an impermeable mica sheet on the shaded side; 1926 Frits Warmolt
      Went agar-block bioassay in Utrecht isolating the diffusible chemical growth messenger (auxin) and showing asymmetric
      coleoptile curvature in darkness when an auxin-loaded agar block is placed off-centre
    source: Darwin C, Darwin F (1880) The Power of Movement in Plants (London:John Murray); Boysen-Jensen P (1913) Berichte
      der Deutschen Botanischen Gesellschaft 31:559–566; Went FW (1926) Proceedings of the Koninklijke Nederlandse Akademie
      van Wetenschappen 30:10–19; historical primary literature examined
    url: https://en.wikisource.org/wiki/The_Power_of_Movement_in_Plants
  - what: TRUE:Jagadish Chandra Bose (Presidency College, Calcutta; Bose Institute 1917) high-magnification crescograph
      and electrical recordings in Mimosa pudica and Desmodium gyrans showing rapid action-potential-like electrical waves
      along plant vascular bundles alongside slower growth responses
    source: Bose JC (1906) Plant Response as a Means of Physiological Investigation; Bose JC (1926) The Nervous Mechanism
      of Plants; existing preserved story source/src/stories/p-bose.md
    url: https://en.wikipedia.org/wiki/Jagadish_Chandra_Bose
  figures:
  - name: c9_plant_tropisms_auxin
    origin: ours; original semantic-theme schematic code in figs_ch09.py; no source illustrations or photographs
    limits: Not to scale; summarizes Darwin/Boysen-Jensen/Went coleoptile experiments (top), shaded-side auxin accumulation
      and cell elongation in shoot positive phototropism (bottom left), and lower-side auxin accumulation in horizontal
      seedlings producing negative gravitropism in shoots and positive gravitropism in roots (bottom right)
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under recorded
    series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party research,
    dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: 'Coleoptile elongation model in coordination_model.js: unilateral light (45°) shifts auxin to 32% illuminated
    / 68% shaded, producing 1.19× vs 1.71× elongation and +26° curvature toward light; mica on shaded side blocks transport
    (0° bend); Went off-centre agar block in darkness gives +18° bend away from block side; horizontal root lower side
    (68% auxin) elongates 0.72× vs upper side 1.38×, bending +24° downward. Verified in tests/ch09_domain.mjs.'
  scope: Rejects the misconception that light destroys auxin on the lit side (Went's lateral redistribution shows total
    auxin yield is conserved); links existing story p-bose without altering p-bose.md.
