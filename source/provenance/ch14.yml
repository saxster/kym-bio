record:ch14-decisions:
  preservation: tests/ch14-preserved.json captures all 333 pre-existing files under source/ (Chapters 0–13 + baselines/gates/runners). Only existing-file change is append-only three Chapter 14 enhancements in source/live/enhancements.js; exact original 102,985 bytes reconstructed and verified. Existing stories (p-ammal.md, p-margulis.md, p-pasteur.md, p-ramachandran.md, franklin-khorana-codebreakers.md, meselson-flemming-gurdon-divisions.md, mendel-morgan-sanghvi-inheritance.md) preserved byte-for-byte and linked naturally in Chapter 14.
  corrections: 'Covered full Cambridge Lower Secondary Science 0893 (8Bp.03, 9Bp.03, 9Bp.04) and Cambridge IGCSE Biology 0610 Topic 18 Variation and selection (18.1 Variation Core 1–7 & Supplement 8–10; 18.2 Adaptive features Core 1–2 & Supplement 3–4; 18.3 Selection Core 1–2 & Supplement 3–5) plus Topic 1.2 Concept and uses of classification systems (Supplement 1.2.5–1.2.6: DNA base sequences and protein amino acid sequences); maintained strict syllabus partition by deferring Topics 19, 20, and 21 (ecology, food webs, nutrient cycles, human ecosystem impacts, biotechnology, and genetic modification) to Chapter 15.'
  source_terms: Recorded source-use decision is not a source licence waiver or evidence of written permission. OpenStax access-for-free footer retained; original prose/art only.
  access_limits: Primary papers Darwin & Wallace 1858, Luria & Delbrück 1943, Lederberg & Lederberg 1952, Kettlewell 1955, Allison 1954, Sahni 1948, and Woese & Fox 1977 verified via open-access archives and primary bibliometric records; exact 0893 framework unavailable; MIT OCW courses not cited where not directly inspected.
  physical_trials: Safe household and classroom camouflage investigation using a newspaper sheet, a hole punch (30 white paper dots + 30 newspaper dots), and blunt forceps across 3 generations of 15-second visual predation; reviewed for safety and feasibility and explicitly disclosed in text as not classroom-trialled for this edition.
  publication: No publication, deployment, commit, push, clone or remote repository operation.
