story:darwin-wallace-luria-sahni-selection:
  ocw: []
  openstax: []
  research: []
  history:
  - what: 'TRUE:Charles Robert Darwin (September–October 1835 Galápagos visit on HMS Beagle; March 1837 ornithological analysis by John Gould identifying 13 endemic ground-finch species and locality reconstruction from Captain Robert FitzRoy, Syms Covington, and Harry Fuller; July 1837 Notebook B page 36 tree sketch; November 1859 On the Origin of Species) and Alfred Russel Wallace (February 1858 Ternate malarial fever insight inspired by Malthus; 1 July 1858 joint Linnean Society reading arranged by Lyell and Hooker while Darwin mourned his infant son Charles Waring Darwin)'
    source: 'Darwin CR, Wallace AR (1858) J Proc Linn Soc Lond (Zool) 3(9):45–62; Sulloway FJ (1982) Darwin and his finches: the legend of theinian voyage, J Hist Biol 15:1–53'
    url: https://www.biodiversitylibrary.org/page/2351477
  - what: 'TRUE:Salvador Luria and Max Delbrück (1943) E. coli fluctuation test; Joshua Lederberg and Esther Lederberg (1952) sterile velveteen replica-plating proof of pre-existing bacterial resistance mutations at Wisconsin; Bernard Kettlewell (1953–1955) Biston betularia mark-release-recapture in Birmingham (53.1% dark vs 27.5% pale) and Dorset (13.7% pale vs 4.7% dark) and Michael Majerus (2001–2007) 4,864-moth canopy confirmation; J. B. S. Haldane (1949) and Anthony Allison (1954) East African HbAHbS malaria protection proof; Birbal Sahni (1948) Rajmahal Hills Jurassic Pentoxyleae; Carl Woese (1977) 16S rRNA three domains'
    source: 'Luria SE, Delbrück M (1943) Genetics 28:491–511; Lederberg J, Lederberg EM (1952) J Bacteriol 63:399–406; Kettlewell HBD (1955) Heredity 9:323–342; Allison AC (1954) BMJ 1:290–294; Sahni B (1948) Bot Gaz 110:47–80; Woese CR, Fox GE (1977) PNAS 74:5088–5090'
    url: https://doi.org/10.1128/jb.63.3.399-406.1952
  figures: []
  licence: Original prose CC BY-NC-SA 4.0; historical primary papers cited for documented facts only; no photographs, quotes or art copied.
  truth_status: 'TRUE documented places (Galápagos Islands, Zoological Society of London, Down House Kent, Ternate Maluku, Linnean Society of London, Bloomington Indiana, University of Wisconsin Madison, Birmingham and Dorset woods, Lake Victoria Uganda, Institute of Palaeobotany Lucknow, University of Illinois Urbana), dates (1835, 1837, 1858, 1859, 1943, 1948, 1949, 1952, 1953–1955, 1977, 2001–2007), and quantitative results (13 finch species, 53.1% vs 27.5% and 13.7% vs 4.7% Kettlewell recapture rates, 4,864 moths in Majerus replication, 290 Ganda children with 27.9% vs 45.7% parasite rates). Explicitly debunks the Darwin finch beach-eureka legend and notes the methodological critique and Majerus confirmation of Kettlewell.'
  access_limits: Darwin & Wallace 1858, Luria & Delbrück 1943, Lederberg & Lederberg 1952, Kettlewell 1955, Allison 1954, Sahni 1948, and Woese & Fox 1977 verified via open-access archives and primary bibliometric records.

