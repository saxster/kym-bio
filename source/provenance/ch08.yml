  - book: Biology 2e
    section: 40.4 Blood Flow and Blood Pressure Regulation
    url: https://openstax.org/books/biology-2e/pages/40-4-blood-flow-and-blood-pressure-regulation
    took: Classical historical comparison only; reader-facing fluid account corrected using revised Starling research
  research:
  - what: 'Core/Supplement placement independently checked: Topic 9.3 Blood vessels & 9.4 Blood, printed pp 23–24'
    source: Cambridge IGCSE Biology 0610 syllabus 2026–2028 v3 and 2029 syllabus; directly inspected
    url: https://www.cambridgeinternational.org/Images/697203-2026-2028-syllabus.pdf
  - what: Vessel structures, plasma components and lymph routes; obsolete classical fluid-return fractions not adopted
    source: OpenStax Anatomy and Physiology 2e (J. Gordon Betts et al.), §§18.1–18.5, §§20.1–20.3, §21.1; corroborating
      physiological facts, no copied prose or source art
    url: https://openstax.org/books/anatomy-and-physiology-2e/pages/20-3-capillary-exchange
  - what: 'Word origin only, not mechanism evidence: capillary, plasma, haemoglobin, erythrocyte, leukocyte, phagocyte,
      lymphocyte, fibrin'
    source: Wiktionary / etymological entries examined via MediaWiki API
    url: https://en.wiktionary.org/wiki/capillary
  - what: Revised Starling principle; no universal venous reabsorption split; distinguish gas diffusion and bulk
      fluid filtration
    source: Adamson et al. 2004 original experiment; Levick and Michel 2010
    url: https://doi.org/10.1113/jphysiol.2003.058255
  history: []
  figures:
  - name: c8_vessel_comparison
    origin: ours; original semantic-theme schematic code in figs_ch08.py; no source illustrations or photographs
    limits: Vessel cross-sections drawn at separate stated enlargements; bottom profiles use representative adult
      vascular tree values
  - name: c8_capillary_bed_blood
    origin: ours; original semantic-theme schematic code in figs_ch08.py; no source illustrations or photographs
    limits: Not to scale; capillary exchange and blood cell types drawn at schematic enlargements
  licence: CC BY-NC-SA 4.0 original prose, SVG and code. OpenStax teaching spine re-taught with attribution under
    recorded series source-use decision; AI-ingestion restriction acknowledged, no claim of permission/waiver. Third-party
    research, dictionary and Cambridge facts citation-only; no copied artwork, assessment items or quotes.
  computed: 'Continuity at4.9L/min: aorta181.481mm/s, capillary0.181481mm/s, vena cava45.370mm/s. A chosen0.5mm
    capillary traversal takes2.755s. No universal fluid-reabsorption percentage or cardiac-output-derived lymph
    flow.'
  scope: Distinguishes plasma, tissue fluid and lymph (RBCs and large plasma proteins remain inside intact capillaries);
    contrasts lobed-nucleus phagocytes with large-round-nucleus lymphocytes; includes fibrinogen-to-fibrin clotting
    cascade.
