story:harvey-circulation:
  ocw: []
  openstax: []
  research: []
  history:
  - what: TRUE:1628 Frankfurt publication by William Fitzer; London lectures from 1616; Padua training under Fabricius;
      Ch IX conservative lower-bound calculation (1, 3 or 4 drachms over 1,000 beats in 30 min = 10 lb 5 oz to 41
      lb 8 oz Troy); Ch X–XI snake-vessel and arm-ligature tests; Ch XIII forearm vein-valve experiment (nodes O
      and H)
    source: William Harvey, Exercitatio Anatomica de Motu Cordis et Sanguinis in Animalibus (Frankfurt:William Fitzer,
      1628), Robert Willis English translation (Sydenham Society, 1847), Chapters VIII–XIV examined verbatim
    url: https://en.wikisource.org/wiki/On_the_Motion_of_the_Heart_and_Blood_in_Animals
  - what: TRUE:Ibn al-Nafis (c. 1242) rejection of septal pores and description of pulmonary transit; Realdo Colombo
      (1559) pulmonary transit; Hieronymus Fabricius (1603) venous valves (ostiola); Marcello Malpighi (1661) microscopic
      observation of frog lung capillaries in De Pulmonibus
    source: West 2008 (PMID 18567862 / PMC2598497) and Ribatti 2009 (PMID 19660509); peer-reviewed historical scholarship
